<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - JOKE GLAMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo-link">
                <img src="images/logo.png" alt="JBP Logo" class="logo-img">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="booking.html">Book Now</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="search.html">🔍 Search</a></li>
                <li><a href="signin.html" class="active">Sign In</a></li>
                <li><a href="cart.html">🛒 Cart</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-header">
        <h1>Sign In to Your Account</h1>
        <p>Create an account or sign in to save your order details.</p>
    </section>

    <section class="shop-section" style="padding-bottom: 4rem;">
        <div class="cart-summary" style="grid-template-columns: 1fr 1fr; gap: 2rem;">
            <div class="checkout-card">
                <h3>Create Account</h3>
                <form id="signupForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input name="signupEmail" type="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input name="signupPassword" type="password" required placeholder="Enter a strong password">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input name="signupConfirm" type="password" required placeholder="Confirm your password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                </form>
            </div>

            <div class="checkout-card">
                <h3>Sign In</h3>
                <form id="signinForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input name="signinEmail" type="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input name="signinPassword" type="password" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-secondary" style="width: 100%;">Sign In</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 JOKE GLAMS. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const signupForm = document.getElementById('signupForm');
        const signinForm = document.getElementById('signinForm');

        signupForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = this.signupEmail.value.trim();
            const password = this.signupPassword.value;
            const confirm = this.signupConfirm.value;

            if (password !== confirm) {
                alert('Passwords do not match. Please try again.');
                return;
            }

            const user = { email, password };
            localStorage.setItem('jbpUser', JSON.stringify(user));
            alert('Account created successfully! You can now sign in.');
            this.reset();
        });

        signinForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = this.signinEmail.value.trim();
            const password = this.signinPassword.value;
            const savedUser = JSON.parse(localStorage.getItem('jbpUser'));

            if (!savedUser) {
                alert('No account found. Please create a new account first.');
                return;
            }

            if (savedUser.email === email && savedUser.password === password) {
                alert('Sign in successful! Welcome back.');
                window.location.href = 'index.html';
            } else {
                alert('Invalid email or password. Please try again.');
            }
        });
    </script>
</body>
</html>
